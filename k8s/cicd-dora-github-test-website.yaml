apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-dora-github-test-website
  namespace: cicd-dora-github-test
  labels:
    app: cicd-dora-github-test-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cicd-dora-github-test-website
  template:
    metadata:
      labels:
        app: cicd-dora-github-test-website
    spec:
      containers:
        # Primary container: reports APM to the STAGING collector on port 8080.
        - name: website-staging
          image: 125229878893.dkr.ecr.us-east-1.amazonaws.com/cicd/cicd-dora-github-test:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            # SolarWinds APM: <ingestion-token>:<service-name>, from the staging Secret.
            - name: SW_APM_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: cicd-dora-github-test-website-apm-staging
                  key: SW_APM_SERVICE_KEY
            - name: SW_APM_COLLECTOR
              value: "apm.collector.na-01.st-ssp.solarwinds.com"
            # Distinct APM service name per workload (overrides the name in the
            # service key so deployment/statefulset/daemonset show up separately).
            - name: OTEL_SERVICE_NAME
              value: "cicd-dora-github-test-deployment"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
        # Second container: same website image, reports APM to the DEV collector
        # on port 8081 (two containers in one pod can't share a port).
        - name: website-dev
          image: 125229878893.dkr.ecr.us-east-1.amazonaws.com/cicd/cicd-dora-github-test:latest
          imagePullPolicy: Always
          ports:
            - name: http-dev
              containerPort: 8081
          env:
            - name: PORT
              value: "8081"
            - name: SW_APM_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: cicd-dora-github-test-website-apm-dev
                  key: SW_APM_SERVICE_KEY
            # Dev collector.
            - name: SW_APM_COLLECTOR
              value: "apm.collector.na-01.dev-ssp.solarwinds.com"
            - name: OTEL_SERVICE_NAME
              value: "cicd-dora-github-test-deployment"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
        - name: traffic-generator
          image: curlimages/curl:8.11.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              while true; do
                curl -sS -o /dev/null -w "traffic-generator: GET / -> %{http_code}\n" http://localhost:8080/ || true
                curl -sS -o /dev/null -w "traffic-generator: GET / -> %{http_code}\n" http://localhost:8081/ || true
                sleep 60
              done
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
      # Required by the cluster's Gatekeeper [podnodeselector] policy.
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/os: linux
---
apiVersion: v1
kind: Service
metadata:
  name: cicd-dora-github-test-website
  namespace: cicd-dora-github-test
  labels:
    app: cicd-dora-github-test-website
spec:
  type: ClusterIP
  selector:
    app: cicd-dora-github-test-website
  ports:
    - name: http
      port: 80
      targetPort: 8080
