apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-dora-github-test-website
  namespace: cicd-dora-github-test
  labels:
    app: cicd-dora-github-test-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-dora-github-test-website
  template:
    metadata:
      labels:
        app: cicd-dora-github-test-website
    spec:
      containers:
        - name: nginx
          image: 125229878893.dkr.ecr.us-east-1.amazonaws.com/cicd/cicd-dora-github-test:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      # Required by the cluster's Gatekeeper [podnodeselector] policy.
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/os: linux
---
apiVersion: v1
kind: Service
metadata:
  name: cicd-dora-github-test-website
  namespace: cicd-dora-github-test
  labels:
    app: cicd-dora-github-test-website
spec:
  type: ClusterIP
  selector:
    app: cicd-dora-github-test-website
  ports:
    - name: http
      port: 80
      targetPort: 8080
