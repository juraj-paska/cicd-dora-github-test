apiVersion: v1
kind: Secret
metadata:
  name: cicd-dora-github-test-website-apm-staging
  namespace: cicd-dora-github-test
  labels:
    app: cicd-dora-github-test-website
    env: staging
type: Opaque
stringData:
  # Format: <swo-ingestion-token>:<service-name>
  # Replace <swo-staging-ingestion-token> with the real STAGING ingestion token.
  # NOTE: this file is applied on every deploy — editing the value in-cluster
  # will be overwritten on the next pipeline run. Change it here in git.
  SW_APM_SERVICE_KEY: "<swo-staging-ingestion-token>:cicd-dora-github-test"
---
apiVersion: v1
kind: Secret
metadata:
  name: cicd-dora-github-test-website-apm-dev
  namespace: cicd-dora-github-test
  labels:
    app: cicd-dora-github-test-website
    env: dev
type: Opaque
stringData:
  # Format: <swo-ingestion-token>:<service-name>
  # Replace <swo-dev-ingestion-token> with the real DEV ingestion token.
  # NOTE: this file is applied on every deploy — editing the value in-cluster
  # will be overwritten on the next pipeline run. Change it here in git.
  SW_APM_SERVICE_KEY: "<swo-dev-ingestion-token>:cicd-dora-github-test"
