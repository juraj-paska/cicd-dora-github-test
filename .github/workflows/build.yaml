name: Build-cicd-dora-github-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_image:
        description: "Build and push a new Docker image"
        type: boolean
        default: true
      deploy:
        description: "Deploy to EKS"
        type: boolean
        default: true
      fail_tests:
        description: "Force the test step to fail"
        type: boolean
        default: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '125229878893'
  ECR_REPOSITORY: cicd/cicd-dora-github-test
  ECR_REGISTRY: 125229878893.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_NAME: 125229878893.dkr.ecr.us-east-1.amazonaws.com/cicd/cicd-dora-github-test
  EKS_CLUSTER_NAME: e2e-cluster
  K8S_NAMESPACE: cicd-dora-github-test

jobs:
  prep:
    name: Prep (compute version)
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Compute short SHA
        id: vars
        run: |
          echo "short_sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      # Dummy test step: passes by default. On a manual run you can tick
      # "fail_tests" to make it fail (and thus block build/deploy).
      - name: Run tests
        env:
          FAIL_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.fail_tests }}
        run: |
          if [ "${FAIL_TESTS}" = "true" ]; then
            echo "::error::Tests failed (fail_tests was set for this manual run)."
            exit 1
          fi
          echo "All tests passed."

  build-image:
    name: Build Docker Image (ECR)
    runs-on: ubuntu-latest
    needs: [prep, test]
    # On push/PR always build; on manual runs only when "build_image" is checked.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_image }}
    permissions:
      contents: read
      id-token: write   # REQUIRED for AWS OIDC
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Configure AWS credentials via OIDC (assume the ECR push role)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::125229878893:role/GitHubActionsECRPush-cicd-dora-github-test
          aws-region: ${{ env.AWS_REGION }}

      # Login to ECR (uses the short-lived credentials from the step above)
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha

      - name: Build and push (tag = short SHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            RUN_NUMBER=${{ github.run_number }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.prep.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: [build-image, prep, test]
    # Never deploy from a PR. On manual runs only when "deploy" is checked.
    # !cancelled() + the result checks let deploy proceed when build-image was
    # skipped (deploy-only run), but not when tests or the build actually failed.
    if: >-
      ${{ !cancelled()
          && github.event_name != 'pull_request'
          && (github.event_name != 'workflow_dispatch' || inputs.deploy)
          && needs.test.result == 'success'
          && needs.build-image.result != 'failure' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::125229878893:role/GitHubActionsECRPush-cicd-dora-github-test
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      - name: Configure kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name "${EKS_CLUSTER_NAME}" \
            --region "${AWS_REGION}"

      # Create/refresh the APM Secrets from encrypted GitHub Actions secrets.
      # The token material never lives in git — only these repo secrets:
      #   SWO_STAGING_INGESTION_TOKEN, SWO_DEV_INGESTION_TOKEN
      - name: Create/refresh APM Secrets
        env:
          STAGING_TOKEN: ${{ secrets.SWO_STAGING_INGESTION_TOKEN }}
          DEV_TOKEN: ${{ secrets.SWO_DEV_INGESTION_TOKEN }}
          # Fallback service name inside the key; each workload overrides it
          # per-pod via OTEL_SERVICE_NAME.
          SERVICE_NAME: cicd-dora-github-test
        run: |
          if [ -z "${STAGING_TOKEN}" ] || [ -z "${DEV_TOKEN}" ]; then
            echo "::error::Repository secrets SWO_STAGING_INGESTION_TOKEN and SWO_DEV_INGESTION_TOKEN must be set."
            exit 1
          fi
          # Namespace must exist before creating namespaced Secrets.
          kubectl apply -f k8s/00-namespace.yaml
          # Idempotent create-or-update (dry-run|apply avoids "already exists").
          kubectl create secret generic cicd-dora-github-test-website-apm-staging \
            -n "${K8S_NAMESPACE}" \
            --from-literal=SW_APM_SERVICE_KEY="${STAGING_TOKEN}:${SERVICE_NAME}" \
            --dry-run=client -o yaml \
            | kubectl label --local -f - --dry-run=client -o yaml \
                app=cicd-dora-github-test-website env=staging \
            | kubectl apply -f -
          kubectl create secret generic cicd-dora-github-test-website-apm-dev \
            -n "${K8S_NAMESPACE}" \
            --from-literal=SW_APM_SERVICE_KEY="${DEV_TOKEN}:${SERVICE_NAME}" \
            --dry-run=client -o yaml \
            | kubectl label --local -f - --dry-run=client -o yaml \
                app=cicd-dora-github-test-website env=dev \
            | kubectl apply -f -

      - name: Apply manifest
        run: |
          kubectl apply -f k8s/

      - name: Update image to commit tag
        env:
          # Images are only ever tagged with the short SHA, so deploy the tag
          # for this commit. On a deploy-only run (build skipped) this assumes
          # the image for this commit was built by an earlier run.
          IMAGE: ${{ env.IMAGE_NAME }}:${{ needs.prep.outputs.short_sha }}
        run: |
          echo "Deploying image: ${IMAGE}"
          # Update both website containers (staging + dev APM reporting) across
          # all three workloads that run this image.
          for kind_name in \
            deployment/cicd-dora-github-test-website \
            statefulset/cicd-dora-github-test-website-sts \
            daemonset/cicd-dora-github-test-website-ds; do
            kubectl set image "${kind_name}" \
              website-staging="${IMAGE}" website-dev="${IMAGE}" -n "${K8S_NAMESPACE}"
          done

          # Gate the deploy on the Deployment and StatefulSet rolling out.
          for kind_name in \
            deployment/cicd-dora-github-test-website \
            statefulset/cicd-dora-github-test-website-sts; do
            kubectl rollout status "${kind_name}" -n "${K8S_NAMESPACE}" --timeout=180s
          done

          # The DaemonSet runs one pod per eligible node and can legitimately be
          # stuck Pending when a node is at pod capacity. Don't fail the whole
          # deploy on it — check with a short timeout and only warn.
          if ! kubectl rollout status daemonset/cicd-dora-github-test-website-ds \
                 -n "${K8S_NAMESPACE}" --timeout=60s; then
            echo "::warning::DaemonSet rollout did not complete in time (likely node pod-capacity); continuing."
            kubectl get pods -n "${K8S_NAMESPACE}" \
              -l app=cicd-dora-github-test-website-ds -o wide || true
          fi
